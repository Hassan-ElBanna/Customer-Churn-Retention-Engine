version: "3.9"

services:
  churn-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-retention-api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs
    environment:
      - CONFIG_PATH=configs/config.yaml
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    restart: unless-stopped

  streamlit-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-retention-ui
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app/app
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      - churn-api
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: churn-mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/mlruns
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped

