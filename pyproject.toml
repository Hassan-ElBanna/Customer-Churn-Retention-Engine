[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-retention-engine"
version = "0.1.0"
description = "End-to-End MLOps Customer Churn Prediction & Retention Recommendation Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.2.2,<1.6.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "scipy>=1.11.0",
    "joblib>=1.2.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0.0",
    "mlflow>=2.10.0",
    "dagshub>=0.3.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
    "evidently>=0.7.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.12.0",
    "pyarrow>=14.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "dvc>=3.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.vercel]
entrypoint = "src.churn_engine.api.main:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

